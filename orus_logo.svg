<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="orusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0ea5e9" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Emblem: Modern Medical Ring 'O' -->
  <g transform="translate(10, 10)">
    <!-- Outer Ring -->
    <circle cx="40" cy="40" r="36" fill="none" stroke="url(#orusGrad)" stroke-width="8" filter="url(#glow)"/>
    <!-- Medical Cross Core -->
    <rect x="36" y="24" width="8" height="32" rx="4" fill="url(#orusGrad)"/>
    <rect x="24" y="36" width="32" height="8" rx="4" fill="url(#orusGrad)"/>
    <!-- Inner Accent Dot -->
    <circle cx="40" cy="40" r="3" fill="#ffffff"/>
  </g>
  
  <!-- Text: ORUS HEALTHCARE -->
  <g transform="translate(105, 52)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="3" fill="#0f172a">
      ORUS
    </text>
    <text x="110" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="300" letter-spacing="4" fill="#0ea5e9">
      HEALTHCARE
    </text>
    <text x="2" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="3.5" fill="#64748b">
      HOSPITAL MANAGEMENT SYSTEM
    </text>
  </g>
</svg>
